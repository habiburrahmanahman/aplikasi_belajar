name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build APK dengan Buildozer

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bersihkan Android SDK Buildozer
        run: |
          rm -rf /github/home/.buildozer/android
          rm -rf .buildozer/android

      - name: Cek resource runner
        run: |
          echo "===== MEMORY ====="
          free -h

          echo ""
          echo "===== DISK ====="
          df -h

          echo ""
          echo "===== CPU ====="
          nproc

      - name: Build dengan Buildozer
        run: |
          set +e

          buildozer -v android debug > build.log 2>&1

          STATUS=$?

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $STATUS"
          echo "========================================"

          echo ""
          echo "===== PESAN ERROR PENTING ====="
          grep -iE "error|failed|fatal|traceback|exception|backend subprocess|command failed" build.log | tail -n 100 || true

          echo ""
          echo "===== 100 BARIS TERAKHIR ====="
          tail -n 100 build.log

          exit $STATUS

      - name: Unggah APK dan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-guru-build
          path: |
            bin/*.apk
            build.log
