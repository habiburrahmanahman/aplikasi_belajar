name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build APK dengan Buildozer

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bersihkan Android SDK Buildozer
        run: |
          rm -rf /github/home/.buildozer/android
          rm -rf .buildozer/android

      - name: Build dengan Buildozer
        run: buildozer android debug

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-guru-apk
          path: bin/*.apk
