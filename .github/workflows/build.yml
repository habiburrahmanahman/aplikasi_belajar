name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build APK dengan Buildozer

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bersihkan Android SDK Buildozer
        run: |
          rm -rf /github/home/.buildozer/android
          rm -rf .buildozer/android

      - name: Build dengan Buildozer
        run: |
          set +e

          buildozer -v android debug 2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $STATUS"
          echo "========================================"

          echo ""
          echo "===== 100 BARIS TERAKHIR LOG ====="
          tail -n 100 build.log

          exit $STATUS

      - name: Unggah APK dan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-guru-build
          path: |
            bin/*.apk
            build.log
