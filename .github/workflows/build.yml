name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build APK dengan Buildozer

    container:
      image: kivy/buildozer:latest
      options: --user user

    steps:
      - uses: actions/checkout@v4

      - name: Cek user
        run: |
          whoami
          id

      - name: Build dengan Buildozer
        run: buildozer android debug

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-guru-apk
          path: bin/*.apk
