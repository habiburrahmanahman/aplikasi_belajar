name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build APK dengan Buildozer

    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bersihkan Android SDK Buildozer
        run: |
          rm -rf /github/home/.buildozer/android
          rm -rf .buildozer

      - name: Pin Cython (kompatibel dengan Kivy 2.3.0)
        run: |
          pip install "cython==0.29.37"
          cython --version

      - name: Cek resource runner
        run: |
          echo "===== MEMORY ====="
          free -h
          echo ""
          echo "===== DISK ====="
          df -h
          echo ""
          echo "===== CPU ====="
          nproc

      - name: Build dengan Buildozer
        run: |
          set +e

          buildozer -v android debug > build.log 2>&1

          STATUS=$?

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $STATUS"
          echo "========================================"

          echo ""
          echo "===== ERROR PERTAMA (penyebab asli biasanya di sini) ====="
          grep -inE "error:|traceback|command failed" build.log | head -n 20 || true

          echo ""
          echo "===== 100 BARIS TERAKHIR ====="
          tail -n 100 build.log

          exit $STATUS

      - name: Unggah APK dan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-guru-build
          path: |
            bin/*.apk
            build.log
